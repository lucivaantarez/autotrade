<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrackStat</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--line:#263354;--text:#e8edf7;--muted:#9ca9c4;--green:#48d597;--yellow:#f1c75b;--red:#f27878;--blue:#73a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,sans-serif}main{max-width:1400px;margin:0 auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.top h1{margin:0;font-size:26px}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.toolbar{display:flex;align-items:center;gap:16px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar span{color:var(--muted)}button{border:1px solid var(--line);background:#1b2845;color:var(--text);padding:9px 13px;border-radius:8px;cursor:pointer}button:hover{border-color:var(--blue)}input{background:#0b1020;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:8px;width:280px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #202b47;white-space:nowrap}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}tr:hover{background:#17223a}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:650}.READY{background:#123b2c;color:var(--green)}.PARTIAL,.RECONNECTING{background:#3f3512;color:var(--yellow)}.STALE{background:#463219;color:#f3ad5d}.OFFLINE{background:#452323;color:var(--red)}.UNKNOWN{background:#29324a;color:var(--muted)}.login{max-width:420px;margin:90px auto;padding:24px}.login h1{margin-top:0}.login form{display:flex;gap:8px}.login input{flex:1}.error{color:var(--red);margin-top:12px}.empty{text-align:center;padding:42px;color:var(--muted)}
</style>
</head>
<body>
<main id="app"><div class="empty">Loading TrackStat…</div></main>
<script>
const app=document.getElementById('app');
let filter='';
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmtTime(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'medium'})}
function age(v,now){if(!v)return '—';const n=(Date.parse(now)-Date.parse(v))/1000;if(n<0)return 'just now';if(n<60)return `${Math.floor(n)}s ago`;if(n<3600)return `${Math.floor(n/60)}m ago`;return `${Math.floor(n/3600)}h ago`}
function login(error=''){app.innerHTML=`<section class="panel login"><h1>TrackStat</h1><p class="muted">Dashboard authentication is required.</p><form id="login"><input id="token" type="password" autocomplete="current-password" placeholder="Dashboard token"><button>Sign in</button></form><div class="error">${escapeHtml(error)}</div></section>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/v1/dashboard/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.getElementById('token').value})});if(r.ok)load();else login('Invalid token.')}}
function render(data){const accounts=(data.accounts||[]).filter(a=>!filter||JSON.stringify(a).toLowerCase().includes(filter.toLowerCase()));app.innerHTML=`<div class="top"><div><h1>TrackStat</h1><div class="muted">Server time: ${escapeHtml(fmtTime(data.server_now))}</div></div><button id="refresh">Refresh</button></div><section class="panel"><div class="toolbar"><input id="filter" placeholder="Filter account" value="${escapeHtml(filter)}"><span>${accounts.length} account(s)</span><span class="muted">Fresh ≤ ${data.stale_seconds}s · Offline &gt; ${data.offline_seconds}s</span></div><div class="scroll">${accounts.length?`<table><thead><tr><th>Account</th><th>Status</th><th>Stars</th><th>Daily</th><th>Streak</th><th>Goal</th><th>Last Sync</th><th>Last Seen</th><th>Observed</th></tr></thead><tbody>${accounts.map(a=>`<tr><td><strong>${escapeHtml(a.username||a.account_key)}</strong><br><span class="muted">${escapeHtml(a.account_id||'')}</span></td><td><span class="badge ${escapeHtml(a.derived_status)}">${escapeHtml(a.derived_status)}</span></td><td>${escapeHtml(a.stars??'—')} / ${escapeHtml(a.egg_price??'—')}</td><td>${escapeHtml(a.daily||'—')}</td><td>${escapeHtml(a.daily_streak??'—')} <span class="muted">/ ${escapeHtml(a.longest_streak??'—')}</span></td><td>${escapeHtml(a.current_goal||'—')}</td><td title="${escapeHtml(a.last_sync_at)}">${escapeHtml(fmtTime(a.last_sync_at))}<br><span class="muted">${escapeHtml(age(a.last_sync_at,data.server_now))}</span></td><td title="${escapeHtml(a.last_seen_at)}">${escapeHtml(fmtTime(a.last_seen_at))}<br><span class="muted">${escapeHtml(age(a.last_seen_at,data.server_now))}</span></td><td>${escapeHtml(fmtTime(a.observed_at))}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No TrackStat reports received.</div>'}</div></section>`;document.getElementById('refresh').onclick=load;document.getElementById('filter').oninput=e=>{filter=e.target.value;render(data)}}
async function load(){const r=await fetch('/api/v1/accounts');if(r.status===401){login();return}if(!r.ok){login('Dashboard request failed.');return}render(await r.json())}
load();setInterval(load,15000);
</script>
</body>
</html>
